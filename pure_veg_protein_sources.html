
<h2 class="sr-only">Pure vegetarian protein sources with protein content per serving, to help reach 50g daily protein intake</h2>
<style>
.pg{padding:1rem 0 2rem}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.25rem}
.fb{font-size:12px;padding:5px 13px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer}
.fb.on{background:var(--color-background-secondary);color:var(--color-text-primary);border-color:var(--color-border-primary);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:14px;cursor:pointer;transition:border-color 0.15s}
.card:hover{border-color:var(--color-border-secondary)}
.card.sel{border:1.5px solid #1D9E75;background:#E1F5EE}
.cat{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-text-tertiary);margin-bottom:5px}
.name{font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:2px}
.serv{font-size:12px;color:var(--color-text-secondary);margin-bottom:8px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-bg{flex:1;background:var(--color-border-tertiary);border-radius:4px;height:6px;overflow:hidden}
.bar-fill{height:6px;border-radius:4px;background:#1D9E75}
.grams{font-size:13px;font-weight:500;color:#0F6E56}
.total-box{margin-top:1.5rem;background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:16px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.total-num{font-size:28px;font-weight:500;color:var(--color-text-primary)}
.total-lbl{font-size:13px;color:var(--color-text-secondary)}
.progress-wrap{flex:1;min-width:120px}
.prog-bg{background:var(--color-border-tertiary);border-radius:6px;height:10px;overflow:hidden;margin-top:6px}
.prog-fill{height:10px;border-radius:6px;background:#1D9E75;transition:width 0.3s}
.prog-lbl{font-size:12px;color:var(--color-text-secondary);margin-top:4px}
.reset-btn{font-size:12px;padding:5px 13px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer}
.tip{margin-top:1rem;font-size:13px;color:var(--color-text-secondary);line-height:1.6;border-left:2px solid var(--color-border-secondary);padding-left:12px;border-radius:0}
.hidden{display:none}
</style>

<div class="pg">
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div class="total-box">
    <div>
      <div class="total-num"><span id="total">0</span>g</div>
      <div class="total-lbl">protein selected</div>
    </div>
    <div class="progress-wrap">
      <div style="font-size:12px;color:var(--color-text-secondary)">Daily target: 50g</div>
      <div class="prog-bg"><div class="prog-fill" id="prog" style="width:0%"></div></div>
      <div class="prog-lbl" id="prog-lbl">0% of daily target</div>
    </div>
    <button class="reset-btn" onclick="resetAll()">Clear all</button>
  </div>
  <div class="tip" id="tip"></div>
</div>

<script>
const items=[
  {name:"Moong dal (cooked)",cat:"Lentils & legumes",serv:"1 cup (200g)",p:14,max:25},
  {name:"Toor dal (cooked)",cat:"Lentils & legumes",serv:"1 cup (200g)",p:15,max:25},
  {name:"Chana dal (cooked)",cat:"Lentils & legumes",serv:"1 cup (200g)",p:13,max:25},
  {name:"Masoor dal (cooked)",cat:"Lentils & legumes",serv:"1 cup (200g)",p:14,max:25},
  {name:"Rajma / kidney beans",cat:"Lentils & legumes",serv:"1 cup (200g)",p:15,max:25},
  {name:"Chole / chickpeas",cat:"Lentils & legumes",serv:"1 cup (200g)",p:15,max:25},
  {name:"Black chana",cat:"Lentils & legumes",serv:"1 cup (200g)",p:14,max:25},
  {name:"Soya chunks (cooked)",cat:"Lentils & legumes",serv:"½ cup (50g dry)",p:25,max:25},
  {name:"Moong sprouts",cat:"Lentils & legumes",serv:"1 cup (100g)",p:8,max:25},
  {name:"Paneer (low fat)",cat:"Dairy",serv:"100g",p:18,max:25},
  {name:"Greek yogurt",cat:"Dairy",serv:"100g",p:10,max:25},
  {name:"Curd / dahi",cat:"Dairy",serv:"1 cup (200g)",p:7,max:25},
  {name:"Milk (toned)",cat:"Dairy",serv:"1 glass (250ml)",p:8,max:25},
  {name:"Whey / milk solids (khoya)",cat:"Dairy",serv:"50g",p:9,max:25},
  {name:"Almonds",cat:"Nuts & seeds",serv:"30g (20–25 nuts)",p:6,max:15},
  {name:"Peanuts",cat:"Nuts & seeds",serv:"30g",p:8,max:15},
  {name:"Pumpkin seeds",cat:"Nuts & seeds",serv:"2 tbsp (20g)",p:5,max:15},
  {name:"Hemp seeds",cat:"Nuts & seeds",serv:"2 tbsp (20g)",p:6,max:15},
  {name:"Flaxseed",cat:"Nuts & seeds",serv:"2 tbsp (20g)",p:4,max:15},
  {name:"Walnuts",cat:"Nuts & seeds",serv:"30g",p:4,max:15},
  {name:"Tofu (firm)",cat:"Soy",serv:"100g",p:8,max:25},
  {name:"Edamame",cat:"Soy",serv:"½ cup (75g)",p:7,max:25},
  {name:"Oats",cat:"Grains",serv:"½ cup dry (40g)",p:7,max:15},
  {name:"Quinoa (cooked)",cat:"Grains",serv:"1 cup (185g)",p:8,max:15},
  {name:"Whole wheat roti",cat:"Grains",serv:"2 rotis (60g)",p:6,max:15},
  {name:"Roasted chana (chhatua)",cat:"Snacks",serv:"30g",p:7,max:15},
  {name:"Makhana (fox nuts)",cat:"Snacks",serv:"30g",p:4,max:10},
  {name:"Peanut butter",cat:"Snacks",serv:"1 tbsp (16g)",p:4,max:10},
];

const cats=["All",...[...new Set(items.map(i=>i.cat))]];
let activeCat="All", selected=new Set();

const filtersEl=document.getElementById("filters");
const gridEl=document.getElementById("grid");
const totalEl=document.getElementById("total");
const progEl=document.getElementById("prog");
const progLbl=document.getElementById("prog-lbl");
const tipEl=document.getElementById("tip");

cats.forEach(c=>{
  const b=document.createElement("button");
  b.className="fb"+(c==="All"?" on":"");
  b.textContent=c;
  b.onclick=()=>{
    activeCat=c;
    document.querySelectorAll(".fb").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    renderGrid();
  };
  filtersEl.appendChild(b);
});

function renderGrid(){
  gridEl.innerHTML="";
  const visible=items.filter(i=>activeCat==="All"||i.cat===activeCat);
  visible.forEach((item,idx)=>{
    const globalIdx=items.indexOf(item);
    const isSel=selected.has(globalIdx);
    const pct=Math.round((item.p/item.max)*100);
    const card=document.createElement("div");
    card.className="card"+(isSel?" sel":"");
    card.innerHTML=`<div class="cat">${item.cat}</div>
<div class="name">${item.name}</div>
<div class="serv">${item.serv}</div>
<div class="bar-row">
  <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
  <span class="grams">${item.p}g</span>
</div>`;
    card.onclick=()=>{
      if(selected.has(globalIdx)) selected.delete(globalIdx);
      else selected.add(globalIdx);
      updateTotal();
      renderGrid();
    };
    gridEl.appendChild(card);
  });
}

function updateTotal(){
  let sum=0;
  selected.forEach(i=>sum+=items[i].p);
  totalEl.textContent=sum;
  const pct=Math.min(Math.round((sum/50)*100),100);
  progEl.style.width=pct+"%";
  progLbl.textContent=pct+"% of daily target";
  if(sum===0) tipEl.textContent="Tap items above to build your daily protein plan.";
  else if(sum<20) tipEl.textContent="Good start. Add a dal or paneer serving to get closer to 50g.";
  else if(sum<40) tipEl.textContent="You're building a solid base. A dal + curd + handful of nuts gets most people to 50g comfortably.";
  else if(sum<50) tipEl.textContent="Almost there — one more small addition (roasted chana, a glass of milk, or peanut butter) will close the gap.";
  else tipEl.textContent="Target reached. These selections spread across 3 meals keep protein steady — avoid eating it all at once, absorption is better ~15–25g per meal.";
}

function resetAll(){selected.clear();updateTotal();renderGrid();}

renderGrid();
updateTotal();
tipEl.textContent="Tap items above to build your daily protein plan.";
</script>
